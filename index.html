<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1117"><title>Копейка — деньги под контролем</title>
<style>
:root{--bg:#0e1015;--panel:#171a21;--panel2:#20242d;--line:#2c313b;--text:#f5f6f8;--muted:#8e96a4;--green:#69d8b3;--red:#f17b83;--yellow:#e7c76a;--blue:#829bff;--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.app{max-width:1120px;margin:auto;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;background:#0e1015eF;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topin{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:20px;display:flex;align-items:center;gap:9px}.coin{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--blue));color:#10151a}.content{padding:16px}.desktopNav{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.navbtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:10px 14px;font-weight:750}.navbtn.active{background:var(--text);color:#111}.btn.primary{background:var(--green);border-color:var(--green);color:#0c1714}.btn.danger{background:#3b2227;color:#ffabb0}.head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin:10px 0 16px}.title{font-size:30px;font-weight:900;letter-spacing:-.8px}.muted{font-size:12px;color:var(--muted)}.hero{padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#1b2430,#15181e);margin-bottom:10px}.heroLabel{color:var(--muted);font-size:12px}.heroValue{font-size:46px;line-height:1.05;font-weight:950;letter-spacing:-2px;margin:5px 0}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;font-size:23px;margin-top:4px}.section{margin:22px 2px 8px;color:var(--muted);font-size:11px;text-transform:uppercase}.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.icon{width:40px;height:40px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;flex:none}.grow{flex:1;min-width:0}.name{font-weight:800}.amount{font-weight:900;white-space:nowrap}.actions{display:flex;gap:7px;flex-wrap:wrap}.progress{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}.empty{text-align:center;padding:32px;color:var(--muted)}.fab{position:fixed;right:18px;bottom:78px;width:58px;height:58px;border:0;border-radius:19px;background:var(--green);color:#0c1714;font-size:30px;font-weight:900;z-index:30;box-shadow:0 10px 30px #0009}.fabmenu{position:fixed;right:18px;bottom:145px;z-index:29;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;min-width:200px;display:none;box-shadow:0 15px 40px #0009}.fabmenu.open{display:block}.fabmenu button{width:100%;display:block;text-align:left;border:0;background:transparent;color:var(--text);padding:12px;border-radius:11px}.fabmenu button:hover{background:var(--panel2)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:#171a21f5;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:none;color:var(--muted);padding:7px 2px;font-size:10px}.bottom b{display:block;font-size:18px}.bottom .active{color:var(--text)}.sheetbg{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:flex-end}.sheetbg.open{display:flex}.sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:13px;padding:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:78px}.day b{display:block}.pill{display:inline-block;margin-top:7px;font-size:10px;padding:3px 6px;border-radius:7px;background:var(--panel2)}
@media(max-width:800px){.desktopNav{display:none}.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}.content{padding:12px}}@media(min-width:801px){.bottom,.fab,.fabmenu{display:none}.app{padding-bottom:25px}}@media(max-width:500px){.grid2{grid-template-columns:1fr}.heroValue{font-size:39px}.calendar{gap:4px}.day{min-height:66px;padding:10px;font-size:12px}}
</style></head>
<body>
<div class="app"><header class="top"><div class="topin"><div class="brand"><span class="coin">₽</span>Копейка</div><div class="actions"><button class="btn" onclick="exportData()">⇩</button><button class="btn" onclick="importData()">⇧</button></div></div></header><div class="content"><nav class="desktopNav" id="desktopNav"></nav><main id="view"></main></div></div>
<button class="fab" onclick="toggleMenu()">+</button><div class="fabmenu" id="fabmenu"><button onclick="openIncome();toggleMenu()">＋ Доход</button><button onclick="openExpense();toggleMenu()">− Расход</button><button onclick="openReserve();toggleMenu()">◎ Резерв</button><button onclick="openDebt();toggleMenu()">↗ Долг</button></div><nav class="bottom" id="bottom"></nav><div class="sheetbg" id="sheetbg"><div class="sheet" id="sheet"></div></div><input id="file" type="file" accept="application/json" hidden>
<script>
const KEY='kopeyka-new-v1';const today=()=>new Date().toISOString().slice(0,10);const n=v=>Number(v)||0;const money=v=>Math.round(n(v)).toLocaleString('ru-RU')+' ₽';const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{balance:0,income:[],expenses:[],debts:[],reserves:[],notes:[],settings:{day:4800,night:4800,anchor:'2026-08-17'}};let current='home';let viewDate=new Date();
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('sheetbg').classList.add('open')}function closeSheet(){document.getElementById('sheetbg').classList.remove('open')}function toggleMenu(){document.getElementById('fabmenu').classList.toggle('open')}
function nav(){const items=[['home','⌂','Главная'],['income','₽','Доходы'],['expenses','🛒','Расходы'],['reserves','◎','Резервы'],['calendar','▦','Календарь'],['notes','✎','Заметки']];document.getElementById('desktopNav').innerHTML=items.map(i=>`<button class="navbtn ${current===i[0]?'active':''}" onclick="go('${i[0]}')">${i[2]}</button>`).join('');document.getElementById('bottom').innerHTML=items.slice(0,5).map(i=>`<button class="${current===i[0]?'active':''}" onclick="go('${i[0]}')"><b>${i[1]}</b>${i[2]}</button>`).join('')}
function go(p){current=p;nav();render()}function totals(){const inc=data.income.reduce((a,x)=>a+n(x.amount),0),exp=data.expenses.reduce((a,x)=>a+n(x.amount),0),debt=data.debts.reduce((a,x)=>a+Math.max(0,n(x.amount)-n(x.paid)),0),saved=data.reserves.reduce((a,x)=>a+n(x.saved),0),need=data.reserves.reduce((a,x)=>a+Math.max(0,n(x.target)-n(x.saved)),0);return{inc,exp,debt,saved,need,cash:n(data.balance)+inc-exp,forecast:n(data.balance)+inc-exp-debt-need}}
function metric(a,b,c,cl=''){return `<div class="card metric"><small>${a}</small><strong class="${cl}">${b}</strong><span class="muted">${c}</span></div>`}function list(arr,fn){return arr.length?arr.map(fn).join(''):`<div class="empty">Пока здесь ничего нет</div>`}
function render(){const t=totals();if(current==='home')home(t);if(current==='income')income();if(current==='expenses')expenses();if(current==='reserves')reserves();if(current==='calendar')calendar();if(current==='notes')notes();nav()}
function home(t){const last=[...data.income.map(x=>({...x,type:'i'})),...data.expenses.map(x=>({...x,type:'e'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);document.getElementById('view').innerHTML=`<div class="head"><div><div class="title">Главная</div><div class="muted">Финансы без лишней суеты</div></div><div class="actions"><button class="btn" onclick="openExpense()">− Расход</button><button class="btn primary" onclick="openIncome()">＋ Доход</button></div></div><div class="hero"><div class="heroLabel">Свободно сейчас</div><div class="heroValue green">${money(t.cash)}</div><div class="muted">после учтённых доходов и расходов</div></div><div class="grid">${metric('Доходы',money(t.inc),'всего','green')}${metric('Расходы',money(t.exp),'всего','red')}${metric('Долги',money(t.debt),'осталось','red')}${metric('Резервы',money(t.saved),'накоплено','green')}</div><div class="grid2"><div class="card"><div class="muted">Финансовая подушка</div><strong style="font-size:28px">${money(t.saved)}</strong><div class="progress" style="margin-top:12px"><i style="width:${t.need+t.saved?Math.min(100,t.saved/(t.need+t.saved)*100):0}%"></i></div><div class="muted" style="margin-top:7px">Осталось до целей: ${money(t.need)}</div></div><div class="card"><div class="muted">После обязательств</div><strong class="${t.forecast>=0?'green':'red'}" style="font-size:28px">${money(t.forecast)}</strong><div class="muted" style="margin-top:7px">результат после долгов и резервов</div></div></div><div class="section">Быстрые действия</div><div class="card"><div class="actions"><button class="btn primary" onclick="openIncome()">＋ Доход</button><button class="btn" onclick="openExpense()">− Расход</button><button class="btn" onclick="openReserve()">◎ Резерв</button><button class="btn" onclick="openDebt()">↗ Долг</button></div></div><div class="section">Последние операции</div><div class="card">${list(last,x=>`<div class="row"><div class="icon">${x.type==='i'?'₽':'🛒'}</div><div class="grow"><div class="name">${x.title||x.name}</div><div class="muted">${x.date}</div></div><div class="amount ${x.type==='i'?'green':'red'}">${x.type==='i'?'+':'−'}${money(x.amount)}</div></div>`)}</div>`}
function income(){document.getElementById('view').innerHTML=`<div class="head"><div><div class="title">Доходы</div><div class="muted">Все поступления</div></div><button class="btn primary" onclick="openIncome()">＋ Добавить</button></div><div class="card">${list(data.income.slice().reverse(),x=>`<div class="row"><div class="icon">₽</div><div class="grow"><div class="name">${x.title}</div><div class="muted">${x.date} · ${x.status==='planned'?'ожидается':'получено'}</div></div><div class="amount green">+${money(x.amount)}</div></div>`)}</div>`}function expenses(){document.getElementById('view').innerHTML=`<div class="head"><div><div class="title">Расходы</div><div class="muted">Контроль трат</div></div><button class="btn primary" onclick="openExpense()">＋ Добавить</button></div><div class="card">${list(data.expenses.slice().reverse(),x=>`<div class="row"><div class="icon">🛒</div><div class="grow"><div class="name">${x.title}</div><div class="muted">${x.date}${x.mandatory?' · обязательный':''}</div></div><div class="amount red">−${money(x.amount)}</div></div>`)}</div>`}function reserves(){document.getElementById('view').innerHTML=`<div class="head"><div><div class="title">Резервы</div><div class="muted">Подушка и финансовые цели</div></div><button class="btn primary" onclick="openReserve()">＋ Создать</button></div>${list(data.reserves,r=>`<div class="card" style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:10px"><b>${r.name}</b><b>${money(r.saved)} / ${money(r.target)}</b></div><div class="progress" style="margin-top:11px"><i style="width:${r.target?Math.min(100,r.saved/r.target*100):0}%"></i></div></div>`)}`}function shiftType(date){const a=new Date(data.settings.anchor+'T12:00:00'),b=new Date(date+'T12:00:00'),d=Math.round((b-a)/86400000),i=((d%6)+6)%6;return ['day','day','night','night','off','off'][i]}function calendar(){const y=viewDate.getFullYear(),m=viewDate.getMonth(),days=new Date(y,m+1,0).getDate();let h=`<div class="head"><div><div class="title">Календарь</div><div class="muted">2 дня · 2 ночи · 2 выходных</div></div><div class="actions"><button class="btn" onclick="viewDate.setMonth(viewDate.getMonth()-1);render()">‹</button><button class="btn" onclick="viewDate.setMonth(viewDate.getMonth()+1);render()">›</button></div></div><div class="calendar">`;for(let i=1;i<=days;i++){const d=new Date(y,m,i).toISOString().slice(0,10),s=shiftType(d),pay=s==='day'?data.settings.day:s==='night'?data.settings.night:0;h+=`<div class="card day"><b>${i}</b><div class="pill">${s==='day'?'ДЕНЬ':s==='night'?'НОЧЬ':'ВЫХОДНОЙ'}</div>${pay?`<div class="green" style="margin-top:5px;font-size:11px">+${money(pay)}</div>`:''}</div>`}document.getElementById('view').innerHTML=h+'</div>'}function notes(){document.getElementById('view').innerHTML=`<div class="head"><div><div class="title">Заметки</div><div class="muted">Личные записи</div></div></div><div class="card"><div class="field"><label>Текст</label><textarea id="note" rows="4"></textarea></div><button class="btn primary" onclick="addNote()">Сохранить заметку</button></div><div class="section">Записи</div>${list(data.notes.slice().reverse(),x=>`<div class="card" style="margin:8px 0"><div>${x.text}</div><div class="muted" style="margin-top:7px">${x.date}</div></div>`)}`}
function form(title,body,action){openSheet(`<div class="sheethead"><b>${title}</b><button class="btn" onclick="closeSheet()">×</button></div>${body}<div class="actions" style="margin-top:15px"><button class="btn" onclick="closeSheet()">Отмена</button><button class="btn primary" onclick="${action}">Сохранить</button></div>`)}function openIncome(){form('Новый доход',`<div class="field"><label>Название</label><input id="inTitle" placeholder="Зарплата, подработка..."></div><div class="field"><label>Сумма</label><input id="inAmount" type="number" inputmode="decimal"></div><div class="field"><label>Дата</label><input id="inDate" type="date" value="${today()}"></div><div class="field"><label>Тип</label><select id="inStatus"><option value="actual">Получено</option><option value="planned">Планируется</option></select></div>`,'saveIncome()')}function saveIncome(){const x={id:uid(),title:document.getElementById('inTitle').value.trim()||'Доход',amount:n(document.getElementById('inAmount').value),date:document.getElementById('inDate').value,status:document.getElementById('inStatus').value};if(!x.amount)return;data.income.push(x);save();closeSheet();render()}function openExpense(){form('Новый расход',`<div class="field"><label>Название</label><input id="exTitle" placeholder="Продукты, транспорт..."></div><div class="field"><label>Сумма</label><input id="exAmount" type="number" inputmode="decimal"></div><div class="field"><label>Дата</label><input id="exDate" type="date" value="${today()}"></div><div class="field"><label><input id="exMandatory" type="checkbox"> Обязательный расход</label></div>`,'saveExpense()')}function saveExpense(){const x={id:uid(),title:document.getElementById('exTitle').value.trim()||'Расход',amount:n(document.getElementById('exAmount').value),date:document.getElementById('exDate').value,mandatory:document.getElementById('exMandatory').checked};if(!x.amount)return;data.expenses.push(x);save();closeSheet();render()}function openReserve(){form('Новый резерв',`<div class="field"><label>Название цели</label><input id="rName" placeholder="Подушка безопасности"></div><div class="field"><label>Цель</label><input id="rTarget" type="number" inputmode="decimal"></div><div class="field"><label>Уже накоплено</label><input id="rSaved" type="number" value="0" inputmode="decimal"></div>`,'saveReserve()')}function saveReserve(){const x={id:uid(),name:document.getElementById('rName').value.trim()||'Резерв',target:n(document.getElementById('rTarget').value),saved:n(document.getElementById('rSaved').value)};if(!x.target)return;data.reserves.push(x);save();closeSheet();render()}function openDebt(){form('Новый долг',`<div class="field"><label>Кому / за что</label><input id="dName"></div><div class="field"><label>Сумма</label><input id="dAmount" type="number"></div><div class="field"><label>Срок</label><input id="dDate" type="date" value="${today()}"></div>`,'saveDebt()')}function saveDebt(){const x={id:uid(),name:document.getElementById('dName').value.trim()||'Долг',amount:n(document.getElementById('dAmount').value),paid:0,dueDate:document.getElementById('dDate').value};if(!x.amount)return;data.debts.push(x);save();closeSheet();render()}function addNote(){const v=document.getElementById('note').value.trim();if(!v)return;data.notes.push({id:uid(),text:v,date:new Date().toLocaleString('ru-RU')});save();render()}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='kopeyka-backup.json';a.click()}function importData(){document.getElementById('file').click()}document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x!=='object')throw 0;data=x;save();render()}catch{alert('Не удалось импортировать этот файл')}};r.readAsText(f)};nav();render();
</script></body></html>
