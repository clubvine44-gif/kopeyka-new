<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>Копейка</title>
<style>
:root{--bg:#0e1015;--panel:#171a21;--panel2:#20242d;--line:#2c313b;--text:#f5f6f8;--muted:#8e96a4;--green:#69d8b3;--red:#f17b83;--blue:#829bff;--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}header{height:64px;position:sticky;top:0;z-index:20;background:#0e1015ee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.brand{display:flex;align-items:center;gap:9px;font-size:20px}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--green),var(--blue));color:#10151a;font-weight:900}.header-actions,.actions{display:flex;gap:7px;flex-wrap:wrap}.icon-btn,.btn,.nav,.mini{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;padding:10px 14px;font-weight:750}.icon-btn{padding:8px 11px}.btn.primary{background:var(--green);border-color:var(--green);color:#0b1713}.wrap{max-width:1120px;margin:auto;padding:16px 16px 96px}.desktop-nav{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.nav.active{background:var(--text);color:#111}.hero-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:10px 0 16px}.hero-head h1{margin:0;font-size:30px;letter-spacing:-.8px}.hero-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.hero{padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#1b2430,#15181e);margin-bottom:10px}.hero small,.card small,.card span{color:var(--muted);display:block;font-size:12px}.hero-number{font-size:46px;line-height:1.05;font-weight:950;letter-spacing:-2px;margin:5px 0;color:var(--green)}.green{color:var(--green)}.red{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}.grid.two{grid-template-columns:repeat(2,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:10px 0}.metric strong{display:block;font-size:23px;margin:4px 0}.card h3{margin:0}.bar{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;background:var(--green);border-radius:8px}.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--panel2);flex:none}.grow{flex:1;min-width:0}.grow b,.grow small{display:block}.grow small{color:var(--muted);font-size:11px;margin-top:3px}.mini{padding:7px 10px}.empty{text-align:center;padding:32px;color:var(--muted)}.big-actions{display:flex;gap:8px}.reserve-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.reserve-top small{margin-top:4px}.fab{position:fixed;right:18px;bottom:78px;width:58px;height:58px;border:0;border-radius:19px;background:var(--green);color:#0b1713;font-size:30px;font-weight:900;z-index:30;box-shadow:0 10px 30px #0009}.fab-menu{position:fixed;right:18px;bottom:145px;z-index:29;display:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;min-width:205px;box-shadow:0 15px 40px #0009}.fab-menu:not(:empty){display:block}.fab-menu button{display:block;width:100%;border:0;background:transparent;color:var(--text);padding:12px;text-align:left;border-radius:11px}.bottom-nav{display:none}.modal-bg{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px}.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.field{display:block;margin:11px 0;color:var(--muted);font-size:11px}.field input,.field select,.modal textarea{display:block;width:100%;margin-top:5px;padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}.check{display:flex;gap:8px;align-items:center;margin:14px 0;color:var(--muted);font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:80px;padding:11px;border:1px solid var(--line);border-radius:15px;background:var(--panel2)}.day b{display:block}.shift{display:inline-block;margin-top:7px;padding:3px 6px;border-radius:7px;font-size:9px}.shift.day{background:#1d3830}.shift.night{background:#2a3150}.shift.off{background:#292d35}.day em{display:block;font-style:normal;color:var(--green);font-size:10px;margin-top:6px}@media(max-width:800px){.desktop-nav{display:none}.wrap{padding:12px 12px 92px}.grid{grid-template-columns:repeat(2,1fr)}.hero-head{align-items:flex-start;flex-direction:column}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:25;height:64px;display:grid;grid-template-columns:repeat(5,1fr);background:#171a21f5;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottom-nav button{border:0;background:transparent;color:var(--muted);font-size:10px}.bottom-nav button strong{display:block;font-size:18px}.bottom-nav button.active{color:var(--text)}header{padding:0 12px}}@media(max-width:500px){.grid.two{grid-template-columns:1fr}.hero-number{font-size:39px}.calendar{gap:4px}.day{min-height:67px;padding:8px;font-size:11px}.row>strong{font-size:13px}.big-actions .btn{flex:1}}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
